services:
  burnnote:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: burnnote
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ORIGIN=${ORIGIN:-http://localhost:3000}
      - DATABASE_PATH=/app/data/burnnote.db
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-30}
      - CLEANUP_INTERVAL_MS=${CLEUP_INTERVAL_MS:-300000}
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    read_only: false
